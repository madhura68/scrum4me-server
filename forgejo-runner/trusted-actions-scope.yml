version: 1
approved_by: "janpeter"
approved_at: "2026-08-31T21:56:04Z"

# risky_triggers_acknowledged (ISS-9, toegevoegd 2026-09-05, besluit JP):
# een per-repo lijst van risicovolle triggers (pull_request, pull_request_target,
# workflow_run) waarvan JP de kruising met een gedeeld runnerlabel expliciet
# aanvaardt. classify() merkt zo'n bevestigde kruising aan als 'accepted' i.p.v.
# 'hard' (§7.7). Grond: `[service] DISABLE_REGISTRATION = true` op de instance —
# er zijn geen self-service accounts, dus fork-PR's komen alleen van door JP
# aangemaakte accounts — plus de per-repo fork-PR-approvalgate
# (RequireApprovalForForkPRWorkflows). Aanvaard restrisico: een vertrouwd account
# kan na een goedgekeurde eerste fork-PR automatisch nieuwe workflows op de
# privileged DinD draaien. Een verkeerd getypt veld (geen lijst) telt fail-closed
# als geen bevestiging. Per repo intrekbaar door de regel te verwijderen.

identities:
  - name: janpeter
  - name: s4m-codex-reviewer

repositories:
  - full_name: janpeter/DigiPlein
    actions_enabled: true
    workflow_source: .forgejo/workflows
    writers: [janpeter, s4m-codex-reviewer]
    risky_triggers_acknowledged: [pull_request]
