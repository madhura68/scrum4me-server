version: 1
approved_by: "janpeter"
approved_at: "2026-08-31T21:56:04Z"

# writers (ISS-42, 2026-09-28): per repo afgedwongen. Een gemeten schrijver
# (owner, admin- of write-collaborator of teamlid) moet een goedgekeurde identiteit
# zijn EN in de writers-lijst van die repo staan; anders HARD. Een identiteit in
# `identities` keurt dus niet langer alle repo's goed: voeg hem expliciet toe aan
# de writers van elke repo waar hij mag schrijven. Ontbrekende of ongeldige
# writers (ook een gequote "[...]") is fail-closed.

# risky_triggers_acknowledged (ISS-9, toegevoegd 2026-09-05, besluit JP):
# een per-repo lijst van risicovolle triggers (pull_request, pull_request_target,
# workflow_run) waarvan JP de kruising met een gedeeld runnerlabel expliciet
# aanvaardt. classify() merkt zo'n bevestigde kruising aan als 'accepted' i.p.v.
# 'hard' (§7.7). Dit is een BEWUSTE RISICO-ACCEPTATIE door JP, geen gevolgtrekking
# uit een setting. Twee gemeten feiten begrenzen de blootstelling maar bewijzen
# het besluit niet: [service] DISABLE_REGISTRATION = true (geen NIEUWE
# zelfregistratie; de roster is gesloten, maar niet elk bestaand account is
# daarmee een bij naam goedgekeurde schrijver) en de per-repo fork-PR-approvalgate
# RequireApprovalForForkPRWorkflows (effectieve staat per repo hier niet
# vastgelegd). Aanvaard restrisico: een bestaand account kan na een goedgekeurde
# eerste fork-PR automatisch nieuwe workflows op de privileged DinD draaien
# (container-escape raakt host/productie; fork-PR's krijgen geen repo-secrets,
# wat de escape niet dekt). Alleen een lijst van bekende triggers telt; iedere
# andere vorm is fail-closed geen bevestiging. Een roster-/policywijziging vraagt
# herbeoordeling; per repo intrekbaar door de regel te verwijderen.

# deploy_keys_acknowledged (AUDIT-012, T-173): een per-repo lijst van
# vingerafdrukken (fingerprint zoals Forgejo ze toont, bv. "SHA256:...") van
# deploy keys MET schrijfrecht (read_only: false) die JP voor die repo bewust
# aanvaardt. Een schrijf-deploy-key kan buiten de identiteiten om code pushen en
# is dus HARD tenzij zijn fingerprint hier staat; bevestigd geeft 'accepted'.
# Alleen-lezen deploy keys hebben geen bevestiging nodig. Een ongeldige vorm
# (geen lijst van niet-lege strings) is fail-closed: niets wordt bevestigd.
# De lijst is een risicobesluit van de eigenaar; voeg niets toe zonder dat besluit.

identities:
  - name: janpeter
  - name: s4m-codex-reviewer
  # mcp-release (ISS-28, besluit JP 2026-09-25): restricted bot, write-collaborator
  # op alleen scrum4me-mcp, token repo-beperkt en alleen leesbaar voor root en
  # ops-agent op scrum4me-srv. Doel: deploy/*-tags snijden (pin_mcp_to_main).
  # Aanvaard restrisico: de token-houder kan een niet-beschermde branch met een
  # workflow pushen; een '*'-branchbescherming is afgewezen omdat Forgejo
  # beschermde branches dan voor niemand meer laat verwijderen.
  - name: mcp-release
  # agent-harness (ISS-42-vervolg, besluit JP 2026-09-28): account van het lokale
  # model (M3). Pusht alleen taakbranches; per repo goedgekeurd voor uitsluitend
  # scrum4me-mcp en agent-harness. main is op beide repo's beschermd met een
  # push- en merge-whitelist van alleen janpeter, dus modelcode landt alleen via
  # een branch en een merge door JP. Leesrecht (scrum4me-shared, Scrum4Me) telt
  # niet als schrijver.
  - name: agent-harness

repositories:
  - full_name: janpeter/DigiPlein
    actions_enabled: true
    workflow_source: .forgejo/workflows
    writers: [janpeter, s4m-codex-reviewer]
    risky_triggers_acknowledged: [pull_request]
    # Schrijf-deploy-key van ops-agent (gemeten 30 sep 2026, aangemaakt 14 jun 2026);
    # bevestigd door JP 30 sep 2026 (T-173, AUDIT-012). Aanvaard restrisico.
    deploy_keys_acknowledged: [SHA256:pt2uHSMkjhJWUXaSPxByjjL/OHXbVBblUav6Ea1GtWs]
